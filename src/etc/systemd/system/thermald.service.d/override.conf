# Drop-in: remove --adaptive so thermald respects /etc/thermald/thermal-conf.xml
# See: man 5 systemd.service ("If the empty string is assigned to this option,
# the list of commands to start is reset...")
# Source: Intel thermal_daemon commit 6225dbd (official workaround for MSI Prestige)
[Service]
ExecStart=
ExecStart=/usr/bin/thermald --systemd --dbus-enable --loglevel=debug --workaround-enabled
