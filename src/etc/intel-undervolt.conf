# intel-undervolt configuration
# Start conservative (-50mV). Stress test, then increment by -10mV.

undervolt 0 'CPU' -50
undervolt 1 'GPU' -50
undervolt 2 'Cache' -50
undervolt 3 'Uncore' -50

# Re-apply undervolt on AC/battery change and resume from suspend
daemon undervolt

# Optional: lower temperature junction target by this many degrees C
# tjoffset -5
