# T480 dual-profile TLP optimizations
# On AC: performance-oriented
# On BAT: battery life-oriented

# ── CPU ─────────────────────────────────────────────────
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1

CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# ── Platform power ──────────────────────────────────────
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

# ── Disk ────────────────────────────────────────────────
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2
DISK_APM_LEVEL_ON_BAT=1

# ── USB ─────────────────────────────────────────────────
USB_AUTOSUSPEND=1
USB_EXCLUDE_BTUSB=0
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_ALL=1

# ── WiFi ────────────────────────────────────────────────
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# ── Audio ───────────────────────────────────────────────
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=N

# ── Battery charge thresholds ───────────────────────────
# Stop charging at 85%, start at 75% for longevity
# ThinkPad-specific: requires tpacpi-bat or tp_smapi
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=85
START_CHARGE_THRESH_BAT1=75
STOP_CHARGE_THRESH_BAT1=85
